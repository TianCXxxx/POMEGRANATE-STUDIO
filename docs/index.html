<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>石榴构图 · 动画预览</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;padding:32px 18px;background:radial-gradient(ellipse at 0 15%,#c9e5f6,transparent 65%),radial-gradient(ellipse at 100% 65%,#e7d7ef,transparent 65%),#f3f6fb;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#273449}main{max-width:520px;margin:6vh auto}h1{font-size:25px;margin:8px 0}header small{letter-spacing:2px;color:#99516a;font-size:10px}.intro{line-height:1.8;color:#66758a;margin:18px 0 28px}.analysis-progress{padding:26px 22px;background:#ffffffa8;border:1px solid #fff;border-radius:26px;box-shadow:inset 0 1px 0 #fff,0 20px 60px #5268861a;backdrop-filter:blur(24px)}.progress-title{display:flex;justify-content:space-between;gap:12px;font-size:13px}#analysisElapsed,#analysisDetail{font-size:12px;color:#718096}#analysisDetail{line-height:1.7;min-height:42px}.actions{display:flex;gap:12px;margin-top:22px}button{flex:1;border:1px solid #fff;border-radius:30px;padding:13px;background:#ffffff9c;color:#78374e;font:inherit;touch-action:manipulation}button:first-child{background:linear-gradient(135deg,#d42a58,#c9184a);color:#fff}footer{font-size:12px;line-height:1.8;margin-top:24px;color:#7c8796}button:focus-visible{outline:3px solid #c9184a66;outline-offset:3px}[hidden]{display:none!important}.analysis-shimmer{animation-play-state:running}
.analysis-track{position:relative;height:8px;margin:16px 0 12px;border-radius:99px;overflow:hidden;background:#dfe8f3}
#analysisBar{display:block;appearance:none;-webkit-appearance:none;width:100%;height:100%;margin:0;border:0;border-radius:inherit;background:#dfe8f3;overflow:hidden}
#analysisBar::-webkit-progress-bar{background:#dfe8f3;border-radius:99px}
#analysisBar::-webkit-progress-value{background:linear-gradient(90deg,#0878ed,#409cff);border-radius:99px}
#analysisBar::-moz-progress-bar{background:linear-gradient(90deg,#0878ed,#409cff);border-radius:99px}
.analysis-motion{position:absolute;inset:0 auto 0 0;width:var(--analysis-progress,0%);border-radius:99px;overflow:hidden;pointer-events:none}
.analysis-shimmer{display:block;width:100%;height:100%;background:linear-gradient(100deg,transparent 20%,#ffffff18 35%,#ffffffaa 50%,#ffffff18 65%,transparent 80%);animation:analysis-flow 1.6s linear infinite;animation-play-state:paused}
.analysis-progress[data-running="true"] .analysis-shimmer{animation-play-state:running}
.analysis-visual{display:flex;flex-direction:column;align-items:center;gap:6px;margin:-4px 0 22px;color:#9b3353;font-size:11px;letter-spacing:1px}
.analysis-visual svg{width:240px;max-width:100%;height:86px;overflow:visible}
.waiting-link{fill:none;stroke:#c9184a;stroke-width:2;stroke-dasharray:5 7;opacity:.55;animation:waiting-current 1.2s linear infinite}
.waiting-source rect,.waiting-output{fill:#fff9;stroke:#d9a7ba;stroke-width:1.4}
.waiting-source path{fill:none;stroke:#ab5572;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.waiting-source{animation:waiting-float 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.waiting-source-two{animation-delay:-1.4s}
.waiting-core rect{fill:#c9184a;stroke:#fffa;stroke-width:1.5}
.waiting-core circle{fill:#fff;animation:waiting-seed 1.8s ease-in-out infinite}
.waiting-core circle:nth-of-type(2){animation-delay:.3s}.waiting-core circle:nth-of-type(3){animation-delay:.6s}
.waiting-output{animation:waiting-seed 1.8s ease-in-out infinite;animation-delay:.9s}
.analysis-progress .analysis-track{background:#f0e1e9}
.analysis-progress #analysisBar::-webkit-progress-bar{background:#f0e1e9}
.analysis-progress #analysisBar::-webkit-progress-value{background:linear-gradient(90deg,#c9184a,#e774a3)}
.analysis-progress #analysisBar::-moz-progress-bar{background:linear-gradient(90deg,#c9184a,#e774a3)}
.analysis-progress:not([data-running="true"]) .analysis-visual *{animation-play-state:paused}
@keyframes waiting-current{to{stroke-dashoffset:-24}}
@keyframes waiting-float{50%{transform:translateY(-4px)}}
@keyframes waiting-seed{0%,100%{opacity:.4}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.analysis-visual *{animation:none!important}}
@keyframes analysis-flow{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@media(prefers-reduced-motion:reduce){.analysis-shimmer{animation:none;opacity:0}}
</style><main><p><a href="choice-a.html" style="color:#9b3353">查看静态石榴方案 A / B / C →</a></p><nav style="margin-bottom:24px"><a href="v2.html" style="color:#9b3353">查看版本二 · 籽粒流光 →</a></nav><header><small>POMEGRANATE STUDIO</small><h1>石榴构图 · 加载动画</h1></header><p class="intro">资料汇聚，关系逐渐成形。<br>这是手机可查看的独立动画预览。</p><section class="analysis-progress" data-running="true"><div class="analysis-visual" aria-hidden="true"><svg viewBox="0 0 240 86"><path class="waiting-link" d="M38 24H84Q98 24 98 43H140M38 62H84Q98 62 98 43M164 43H202"/><g class="waiting-source"><rect x="18" y="12" width="28" height="24" rx="7"/><path d="M26 21h12m-12 6h8"/></g><g class="waiting-source waiting-source-two"><rect x="18" y="50" width="28" height="24" rx="7"/><path d="m28 58-4 4 4 4m8-8 4 4-4 4"/></g><g class="waiting-core"><rect x="130" y="23" width="40" height="40" rx="13"/><circle cx="143" cy="37" r="3"/><circle cx="158" cy="39" r="3"/><circle cx="150" cy="51" r="3"/></g><rect class="waiting-output" x="198" y="30" width="26" height="26" rx="8"/></svg><span>正在构建你的架构</span></div><div class="progress-title"><strong id="analysisStage">准备分析</strong><span id="analysisElapsed"></span></div><div class="analysis-track"><progress id="analysisBar" max="100" value="0" aria-label="分析阶段进度"></progress><span class="analysis-motion" aria-hidden="true"><span class="analysis-shimmer"></span></span></div><div id="analysisDetail"></div></section><div class="actions"><button id="replay">重新播放</button><button id="pause">暂停动画</button></div><footer>仅用于外观预览，不提供文件分析功能。<br>独立分支：codex/mobile-preview</footer></main><script>const card=document.querySelector('.analysis-progress'),bar=document.querySelector('#analysisBar'),stage=document.querySelector('#analysisStage'),detail=document.querySelector('#analysisDetail'),elapsed=document.querySelector('#analysisElapsed');let start=performance.now(),paused=false,stopped=0;const stages=['读取项目证据','分析组件关系','构建架构图','调整布局与标签'];function tick(){const t=(paused?stopped:performance.now())-start;const phase=Math.floor(t/6000)%4;stage.textContent=stages[phase];detail.textContent='演示动画 · 不上传文件，不调用模型；进度为预览模拟。';elapsed.textContent=Math.floor(t/1000)+' 秒';const value=(t%24000)/240;bar.value=value;card.style.setProperty('--analysis-progress',value+'%');}setInterval(tick,100);tick();document.querySelector('#pause').onclick=function(){paused=!paused;if(paused)stopped=performance.now();else start+=performance.now()-stopped;card.dataset.running=String(!paused);card.querySelectorAll('*').forEach(e=>e.style.animationPlayState=paused?'paused':'');this.textContent=paused?'继续播放':'暂停动画'};document.querySelector('#replay').onclick=()=>{start=performance.now();paused=false;card.dataset.running='true';card.querySelectorAll('*').forEach(e=>e.style.animationPlayState='');document.querySelector('#pause').textContent='暂停动画';tick()};</script></html>
