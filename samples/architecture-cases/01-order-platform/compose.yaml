services:
  orders:
    image: example/01-order-platform-orders:demo
    command: uvicorn services.orders.main:app --host 0.0.0.0 --port 8100
    ports: ['8100:8100']
  inventory:
    image: example/01-order-platform-inventory:demo
    command: uvicorn services.inventory.main:app --host 0.0.0.0 --port 8101
    ports: ['8101:8101']
  payments:
    image: example/01-order-platform-payments:demo
    command: uvicorn services.payments.main:app --host 0.0.0.0 --port 8102
    ports: ['8102:8102']
  notifications:
    image: example/01-order-platform-notifications:demo
    command: uvicorn services.notifications.main:app --host 0.0.0.0 --port 8103
    ports: ['8103:8103']
  rabbitmq:
    image: rabbitmq:3
    ports: ['5672:5672']
